<!DOCTYPE html>
<html>
<head>
  <title>MediCare+</title>

  <link rel="stylesheet"
  href="{{ url_for('static', filename='css/style.css') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">
</head>

<body class="login-body">

<div class="login-box">

  <h1>MediCare+</h1>

  <form action="/login" method="POST">

    <input type="email"
    name="email"
    placeholder="Enter Email"
    required>

    <input type="password"
    name="password"
    placeholder="Enter Password"
    required>

    <button type="submit">
      Login
    </button>

  </form>

  <hr>

  <h3>Create Account</h3>

  <form action="/register" method="POST">

    <input type="text"
    name="name"
    placeholder="Full Name"
    required>

    <input type="email"
    name="email"
    placeholder="Email"
    required>

    <input type="password"
    name="password"
    placeholder="Password"
    required>

    <button type="submit">
      Register
    </button>

  </form>

</div>

</body>
</html>
